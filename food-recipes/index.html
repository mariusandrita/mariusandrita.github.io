<!doctype html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marius Food Collection</title>
<meta name="description" content="Rețete autentice din țara de origine, comparate din mai multe surse, cu pași, timere și poze. Authentic recipes from their country of origin.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Marius Food Collection">
<meta property="og:title" content="Marius Food Collection">
<meta property="og:description" content="Rețete autentice, cu pași, timere, poze și listă de cumpărături. Authentic recipes with steps, timers, photos and a shopping list.">
<meta property="og:image" content="https://mariusandrita.github.io/food-recipes/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://mariusandrita.github.io/food-recipes/">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="eyebrow" id="t-eyebrow"></p>
    <h1 id="t-title"></h1>
    <p class="subtitle" id="t-sub"></p>
    <div class="toggle-container">
      <span>English</span>
      <label class="switch">
        <input type="checkbox" id="lang-toggle" checked>
        <span class="slider round"></span>
      </label>
      <span>Română</span>
    </div>
    <p class="refs-link"><a href="#refs" id="refs-top"></a></p>
  </header>

  <section class="filters">
    <input id="q" type="search" autocomplete="off">
    <div id="chips"></div>
    <p id="count" class="count"></p>
  </section>

  <main id="cards" class="grid"></main>

  <section id="refs" class="refs">
    <h2 id="t-refs"></h2>
    <div id="refs-list" class="refs-list"></div>
  </section>

  <footer id="t-footer"></footer>

  <button id="shop-fab" class="fab" type="button"></button>

  <div id="reader" class="reader" hidden>
    <div class="reader-bar">
      <button id="reader-close" type="button" aria-label="Close">←</button>
      <div class="bar-actions">
        <button id="reader-share" type="button"></button>
        <button id="reader-add" type="button"></button>
        <button id="reader-reset" type="button"></button>
      </div>
    </div>
    <article id="reader-body" class="reader-body"></article>
  </div>

  <div id="shop" class="reader" hidden>
    <div class="reader-bar">
      <button id="shop-close" type="button" aria-label="Close">←</button>
      <div class="bar-actions">
        <button id="shop-copy" type="button"></button>
        <button id="shop-clear" type="button"></button>
      </div>
    </div>
    <article id="shop-body" class="reader-body"></article>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
